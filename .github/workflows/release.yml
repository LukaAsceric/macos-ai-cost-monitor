name: Release macOS app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must use semantic versioning, for example v0.1.0"; exit 1 ;;
          esac

      - name: Fetch Sparkle signing tools
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz" | shasum -a 256 -c -
          SPARKLE_TOOL_ROOT="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}"
          mkdir -p "$SPARKLE_TOOL_ROOT"
          tar -xJf "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz" -C "$SPARKLE_TOOL_ROOT"
          test -x "$SPARKLE_TOOL_ROOT/bin/generate_appcast"

      - name: Verify Sparkle signing configuration
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY" || { echo "Missing SPARKLE_EDDSA_PRIVATE_KEY repository secret"; exit 1; }
          test -n "$SPARKLE_PUBLIC_ED_KEY" || { echo "Missing SPARKLE_PUBLIC_ED_KEY repository secret"; exit 1; }

      - name: Build, test, sign, package, and generate signed appcast
        env:
          VERSION: ${{ github.ref_name }}
          SPARKLE_BIN: ${{ runner.temp }}/Sparkle-2.9.6/bin
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          RELEASE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" bash Scripts/package-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: MacOSAICostMonitor-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/*-macOS.md
            dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI Cost Monitor $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            dist/*-macOS.md \
            dist/appcast.xml
